<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esquema Unifilar General Definitivo — SUB-01 (CGBT 400/230 V), GE-01 125 kVA, SAI-01, BAT-01 y PCI</title>
  <style>
    /* =========================================================================
       SISTEMA DE DISEÑO CORPORATIVO — INGENIERÍA ELÉCTRICA INDUSTRIAL (CSS PURO)
       ========================================================================= */
    :root {
      --bg-app: #F4F7FB;
      --bg-card: #FFFFFF;
      --bg-soft: #F8FAFC;
      --border: #CBD5E1;
      --border-light: #E2E8F0;
      --text-main: #0F172A;
      --text-body: #334155;
      --text-muted: #64748B;

      --navy: #0F2A5F;
      --blue: #1D4ED8;
      --blue-bg: #EFF6FF;
      --blue-bd: #BFDBFE;

      --red-dark: #B91C1C;
      --red: #DC2626;
      --red-bg: #FEF2F2;
      --red-bd: #FECACA;

      --amber-dark: #B45309;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
      --amber-bd: #FDE68A;

      --green-dark: #047857;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --green-bd: #A7F3D0;

      --off: #94A3B8;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }

    .app-shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* =========================================================================
       CABECERA PRINCIPAL Y ACCIONES DE EXPORTACIÓN
       ========================================================================= */
    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .eyebrow-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--blue-bg);
      border: 1px solid var(--blue-bd);
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
    }

    .main-title {
      margin: 0;
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .main-subtitle {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-body);
      font-weight: 500;
    }

    .export-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--navy);
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-soft);
      border-color: #94A3B8;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.24);
    }

    .btn-primary:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #FFFFFF;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* =========================================================================
       BARRA DE SIMULADOR DE ESCENARIOS (4 BOTONES)
       ========================================================================= */
    .simulator-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }

    .scenario-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .sim-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .scenario-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-body);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .scenario-btn .sc-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .scenario-btn[data-scenario="normal"] .sc-dot { background: var(--blue); }
    .scenario-btn[data-scenario="fire"] .sc-dot { background: var(--red); }
    .scenario-btn
